# Deep sleep after 30 minutes of inactivity
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Boost BT TX power to +8 dBm (from default 0 dBm) for better range and
# connection stability. Costs ~5-15% battery life. Re-enabled because
# intermittent lag/dropped keys was happening when at 0 dBm.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Increase debouncing to prevent multiple inputs from switch bounce/chatter
# Slightly higher values improve stability on bouncy switches without feeling laggy
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# Run nice!view redraws below the threads that send keystrokes (to the host
# on the left half, to the left half on the right half). All three default
# to priority 5, so a redraw could hold keys back and release them in a burst.
# 10 = ZMK's low-priority thread level. https://github.com/zmkfirmware/zmk/issues/3459
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y

# Enable mouse keys (the scroll keys). ZMK_MOUSE is the old, deprecated name.
CONFIG_ZMK_POINTING=y
