# Left half only (the split central). lily58.conf still applies to both halves.

# Key events from the right half wait in this queue until the left half
# processes them. The default holds 5, and an event that does not fit is
# dropped without a log. A dropped key-up leaves the key held on the host, so
# the host repeats it until that key is pressed again. The queue fills when the
# left half is blocked, e.g. up to 100 ms per report when the Bluetooth report
# queue to the host is full. 32 entries cost well under 1 KB of RAM.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=32
