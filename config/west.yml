manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      # PINNED to a known ZMK main commit (2026-09-15, Zephyr 4.1 / HWMv2).
      # Keep this SHA in sync with .github/workflows/build.yml, and keep the
      # board in build.yaml as `nice_nano//zmk`.
      #
      # History: on 2026-05-04 this was pinned to abb64ba (pre-Zephyr 4.1)
      # because the Zephyr 4.1 build drained the battery overnight. That was
      # ZMK issue #3207: the central half hangs in deep sleep when
      # CONFIG_ZMK_SLEEP=y. It was fixed in ZMK's Zephyr fork on 2026-06-24
      # and confirmed on the same Lily58 + nice!nano v2 + nice!view setup.
      # https://github.com/zmkfirmware/zmk/issues/3207
      #
      # If the battery drain comes back, roll back all three together:
      #   1. revision below -> abb64ba316c29caddc49727ca2cac2f0ed5970c7
      #   2. the workflow in .github/workflows/build.yml -> the same SHA
      #   3. boards in build.yaml -> nice_nano_v2
      revision: 9ebbeff0a8b69a42f14aec022cdf16c7a107b9e0
      import: app/west.yml
  self:
    path: config
